services:
  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"

  # Local embedding server — bge-m3 via sentence-transformers.
  # First start downloads the model (~2.3 GB), cached in embedding-models volume.
  embedding:
    build: ./embedding-server
    ports:
      - "11435:8000"
    volumes:
      - embedding-models:/data
    environment:
      - MODEL_NAME=BAAI/bge-m3

volumes:
  embedding-models:

