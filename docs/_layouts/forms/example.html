<!DOCTYPE html>
<html lang="{{ note.Lang() }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ note.Title() }}</title>
  <style>
    :root {
      --bg: #0e0e0e;
      --fg: #f5f5f2;
      --muted: #9a9a93;
      --rule: #2a2a26;
      --accent: #c8ff5a;
      --error: #ff6b6b;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "JetBrains Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
    main { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
    .article :is(h1,h2,h3) { font-weight: 700; letter-spacing: -0.01em; }
    .article h1 { font-size: 32px; margin: 0 0 12px; }
    .article h2 { font-size: 20px; margin: 32px 0 8px; }
    .article p { line-height: 1.6; color: var(--fg); }
    .article a { color: var(--accent); }
    .article code { font-family: var(--mono); background: #1a1a17; padding: 1px 6px; border-radius: 3px; font-size: 0.9em; }
    .article pre { background: #1a1a17; padding: 16px; border-radius: 4px; overflow-x: auto; font-size: 13px; }

    .form-card {
      margin-top: 40px;
      border: 1px solid var(--rule);
      padding: 28px;
      background: rgba(245,245,242,0.02);
    }
    .form-card__title {
      margin: 0 0 18px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .form-card__field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-card__field--inline { flex-direction: row; align-items: center; gap: 10px; }
    .form-card__label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }
    .form-card__label--required::after { content: " *"; color: var(--accent); }
    .form-card__input, .form-card__textarea {
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--fg);
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 14px;
      outline: none;
    }
    .form-card__input:focus, .form-card__textarea:focus { border-color: var(--accent); }
    .form-card__textarea { min-height: 110px; resize: vertical; }
    .form-card__submit {
      background: var(--accent);
      color: var(--bg);
      border: 0;
      padding: 12px 22px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .form-card__submit:hover { filter: brightness(1.05); }
    .form-card__submit:disabled { opacity: 0.5; cursor: progress; }
    .form-card__status { margin-top: 14px; font-family: var(--mono); font-size: 13px; min-height: 1.4em; }
    .form-card__status--ok { color: var(--accent); }
    .form-card__status--err { color: var(--error); }
    .form-card__error { color: var(--error); font-family: var(--mono); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <article class="article">
      <h1>{{ note.Title() }}</h1>
      {{ note.HTMLString() | unsafe }}
    </article>

    <section class="form-card">
      <div class="form-card__title">Send a message</div>
      <form id="demo-form" novalidate></form>
      <div id="demo-status" class="form-card__status" aria-live="polite"></div>
    </section>

    <script id="form-spec" type="application/json">{{ note.FormSpecJSON() | unsafe }}</script>
    <script>
      (function () {
        const specEl = document.getElementById('form-spec');
        if (!specEl) return;
        let spec;
        try { spec = JSON.parse(specEl.textContent); }
        catch (e) { console.error('form-spec parse error', e); return; }

        const formEl = document.getElementById('demo-form');
        const statusEl = document.getElementById('demo-status');
        const formId = '';
        const definition = (spec.forms || {})[formId];
        if (!definition) { statusEl.textContent = 'No form defined.'; return; }

        for (const field of definition.fields || []) {
          const wrap = document.createElement('div');
          wrap.className = 'form-card__field' + (field.type === 'bool' ? ' form-card__field--inline' : '');

          const labelText = (field.label || field.name).toString();
          const required = field.required === true;

          let input;
          if (field.type === 'bool') {
            input = document.createElement('input');
            input.type = 'checkbox';
            input.name = field.name;
            wrap.appendChild(input);

            const label = document.createElement('label');
            label.className = 'form-card__label' + (required ? ' form-card__label--required' : '');
            label.textContent = labelText;
            wrap.appendChild(label);
          } else {
            const label = document.createElement('label');
            label.className = 'form-card__label' + (required ? ' form-card__label--required' : '');
            label.textContent = labelText;
            wrap.appendChild(label);

            if (field.type === 'text' && (field.max_length || 0) > 120) {
              input = document.createElement('textarea');
              input.className = 'form-card__textarea';
            } else {
              input = document.createElement('input');
              input.className = 'form-card__input';
              if (field.type === 'email') input.type = 'email';
              else if (field.type === 'int') {
                input.type = 'number';
                if (field.min !== undefined) input.min = String(field.min);
                if (field.max !== undefined) input.max = String(field.max);
              } else input.type = 'text';
            }
            input.name = field.name;
            if (required) input.required = true;
            wrap.appendChild(input);
          }

          formEl.appendChild(wrap);
        }

        const submit = document.createElement('button');
        submit.type = 'submit';
        submit.className = 'form-card__submit';
        submit.textContent = 'Submit';
        formEl.appendChild(submit);

        formEl.addEventListener('submit', async function (event) {
          event.preventDefault();
          submit.disabled = true;
          statusEl.className = 'form-card__status';
          statusEl.textContent = 'Sending…';

          const fields = [];
          for (const field of definition.fields || []) {
            const el = formEl.elements.namedItem(field.name);
            if (!el) continue;
            const entry = { name: field.name };
            if (field.type === 'bool') entry.boolValue = el.checked;
            else if (field.type === 'int') entry.intValue = el.value === '' ? null : parseInt(el.value, 10);
            else entry.stringValue = el.value;
            fields.push(entry);
          }

          const query = `mutation Submit($input: SubmitFormInput!) {
            submitForm(input: $input) {
              __typename
              ... on SubmitFormPayload { submitId }
              ... on FormSubmitDeniedPayload { reason }
              ... on ErrorPayload { message byFields { name value } }
            }
          }`;

          try {
            const response = await fetch('/_system/graphql', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                query,
                variables: {
                  input: {
                    noteVersionId: spec.note_version_id,
                    formId,
                    fields,
                  },
                },
              }),
            });
            const json = await response.json();
            if (json.errors && json.errors.length) {
              throw new Error(json.errors[0].message || 'Request failed');
            }
            const payload = json.data && json.data.submitForm;
            if (payload && payload.__typename === 'SubmitFormPayload') {
              statusEl.className = 'form-card__status form-card__status--ok';
              statusEl.textContent = 'Thanks — submission #' + payload.submitId + ' received.';
              formEl.reset();
              if (definition.success_url) {
                statusEl.textContent += ' Redirecting…';
                setTimeout(function () { window.location.href = definition.success_url; }, 600);
              }
            } else if (payload && payload.__typename === 'FormSubmitDeniedPayload') {
              statusEl.className = 'form-card__status form-card__status--err';
              const messages = {
                admin_required: 'Only an admin can submit this form. Sign in as admin and try again.',
                paid_required: 'This form requires a paid plan.',
                not_implemented: 'This access level is not enforced yet — submissions are blocked.',
              };
              statusEl.textContent = messages[payload.reason] || ('Submission denied (' + payload.reason + ')');
            } else if (payload && payload.__typename === 'ErrorPayload') {
              statusEl.className = 'form-card__status form-card__status--err';
              const detail = (payload.byFields || []).map(function (f) { return f.name + ': ' + f.value; }).join('; ');
              statusEl.textContent = (payload.message || 'Validation failed') + (detail ? ' — ' + detail : '');
            } else {
              statusEl.className = 'form-card__status form-card__status--err';
              statusEl.textContent = 'Unexpected response.';
            }
          } catch (err) {
            statusEl.className = 'form-card__status form-card__status--err';
            statusEl.textContent = err.message || 'Network error';
          } finally {
            submit.disabled = false;
          }
        });
      })();
    </script>
  </main>
</body>
</html>
