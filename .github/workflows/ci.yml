name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Prepare generated files
        run: go generate ./...

      - name: Run golangci-lint
        run: go tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint run --build-tags dev

      - name: Lint docs (trip2g lint docs)
        run: go run -tags dev ./cmd/server lint docs

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Prepare generated files
        run: go generate ./...

      - name: Run tests
        run: go test -tags dev ./...

  # Sandbox enforcement lane: runs the code-exec isolation tests on a runner
  # that supports unprivileged user namespaces + Landlock. FLEET_SANDBOX_MUST_ENFORCE=1
  # turns the tests' t.Skip guards into HARD FAILURES, so if a runner lacks
  # userns/Landlock the job fails loudly instead of reporting a false "green"
  # for tests that never actually ran. bash + python3 (the interpreters the
  # probes use) ship on ubuntu-latest. Network is left BLOCKED here on purpose
  # (no TRIP2G_FLEET_SANDBOX_NETWORK): TestSandbox_NetworkBlocked must enforce.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Prepare generated files
        run: go generate ./...

      - name: Run sandbox enforcement tests (must actually enforce)
        env:
          FLEET_SANDBOX_MUST_ENFORCE: "1"
        run: go test -tags dev -race -run TestSandbox ./internal/agentruntime/...

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: false # disabled in CI, run locally with ./scripts/test-e2e.sh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Add minio host alias
        run: echo "127.0.0.1 minio" | sudo tee -a /etc/hosts

      - name: Run E2E tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./scripts/test-e2e.sh
