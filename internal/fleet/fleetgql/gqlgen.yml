# gqlgen config for the fleet binary's own GraphQL surface (roles + roleGraph).
# Separate from the monolith's repo-root gqlgen.yml and its generated package —
# this is a standalone 2-query read API compiled into cmd/fleet.
#
# Regenerate:
#   go tool github.com/99designs/gqlgen generate --config internal/fleet/fleetgql/gqlgen.yml

schema:
  - internal/fleet/fleetgql/schema.graphqls

exec:
  package: fleetgen
  layout: single-file
  filename: internal/fleet/fleetgql/fleetgen/generated.go

model:
  filename: internal/fleet/fleetgql/model/models_gen.go
  package: model

resolver:
  package: fleetgql
  layout: follow-schema
  dir: internal/fleet/fleetgql
  filename_template: "{name}.resolvers.go"

omit_slice_element_pointers: true
omit_complexity: true
skip_mod_tidy: true
