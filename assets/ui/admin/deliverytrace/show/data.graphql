query ($trace: String!) {
	admin {
		deliveryTrace(trace: $trace) {
			kind
			id
			webhookId
			status
			responseStatus
			attempt
			durationMs
			tokensUsed
			steps
			createdAt
			startedAt
			completedAt
			parentKind
			parentId
			depthReached
			writes {
				path
				version
			}
		}
	}
}
