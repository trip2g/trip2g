mutation ($input: CreateUserTokenInput!) {
	createUserToken(input: $input) {
		__typename
		... on CreateUserTokenPayload {
			plaintextToken
			instructions
			token {
				id
				name
				tokenPrefix
				scope
				createdAt
				lastUsedAt
				expiresAt
			}
		}
		... on ErrorPayload {
			message
		}
	}
}
