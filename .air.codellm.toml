root = "."
tmp_dir = "tmp"

# Dev hot-reload config for the codellm sidecar (see `make aircodellm`).
# Runs cmd/codellm against a local `make air` hub with the dev defaults:
#   - hub user-token secret = the dev default ("please-change-me-...")
#   - graph UI  → http://127.0.0.1:9099/   (JSON at /graph.json)
#   - code-block debug UI → http://127.0.0.1:9098/
# LLM roles: export TRIP2G_codellm_LLM_BASE_URL / TRIP2G_codellm_LLM_API_KEY before running.
[build]
  cmd = "go build -tags=dev -o ./tmp/codellm ./cmd/codellm"
  bin = "./tmp/codellm"
  args_bin = []
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules", "out", "obsidian-sync", "infra", "test-results", "playwright-report", "docs", "demo"]
  exclude_regex = ["_test.go", "easyjson"]
  include_ext = ["go", "html"]
  kill_delay = "2s"
  log = "build-errors.log"
  send_interrupt = true

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = false
