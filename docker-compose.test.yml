name: trip2g_test_env

services:
  minio:
    image: minio/minio:latest
    container_name: trip2g-test-minio
    ports:
      - "29000:29000"
      - "29001:29001"
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpassword
    command: server /data --console-address ":29001" --address ":29000"
    # /data is ephemeral. The minio image declares VOLUME /data, so an anonymous
    # volume is created and SURVIVES `docker compose rm -v` (which does not remove
    # image-declared anon volumes). A stale backup left there gets restored over a
    # freshly-seeded DB and breaks the onboarding/no-notes test. tmpfs gives every
    # container (re)create a clean /data — no stale backups, no manual volume drop.
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:29000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Light OIDC IdP (Dex) for the real-IdP login test (e2e/oidc-dex.spec.js).
  # Published on :5556 so the browser (host-resolver rule) and the app container
  # (host gateway) both reach the issuer http://host.docker.internal:5556.
  dex:
    image: ghcr.io/dexidp/dex:latest
    container_name: trip2g-test-dex
    command: ["dex", "serve", "/config.yaml"]
    volumes:
      - ./testdata/dex/config.yaml:/config.yaml:ro
    ports:
      - "5556:5556"

  # Local embedding server — bge-m3 via sentence-transformers.
  # First start downloads the model (~2.3 GB) — subsequent starts reuse shared ~/models/embedding.
  embedding:
    build: ./embedding-server
    container_name: trip2g-test-embedding
    ports:
      - "11434:8000"
    volumes:
      - ${HOME}/models/embedding:/data
    environment:
      - MODEL_NAME=BAAI/bge-m3
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip2g-test-app
    # Lets the container reach an OIDC issuer over the host gateway: the host-run
    # node mock (e2e/oidc.spec.js) and the published Dex service (e2e/oidc-dex.spec.js).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
      dex:
        condition: service_started
    ports:
      - "20081:20081"
      - "20082:20082"
    environment:
      # Server
      - LISTEN_ADDR=0.0.0.0:20081
      - INTERNAL_LISTEN_ADDR=:20082
      - DB_FILE=/data/test.sqlite3
      - DEV=true # sign in code 111111
      - MAX_ACTIVE_SIGNIN_CODES=999
      - LOG_LEVEL=debug
      - OWNER_EMAIL=hello@example.com
      - SHUTDOWN_GRACE_PERIOD=1ms
      - SHUTDOWN_TIMEOUT=1ms
      - 'FEATURES={"vector_search": {"enabled": true, "model": "bge-m3", "base_url": "http://embedding:8000/v1"}}'

      # MinIO
      - MINIO_ENDPOINT=minio:29000
      - MINIO_ACCESS_KEY_ID=testuser
      - MINIO_SECRET_KEY=testpassword
      - MINIO_BUCKET=test-bucket
      - MINIO_USE_SSL=false
      - SIMPLE_BACKUP=true

      # Public URL
      - PUBLIC_URL=http://localhost:20081
      # - PUBLIC_URL=https://trip2g.com # for telegram links

      # JWT (test secret - НЕ использовать в продакшене!)
      - JWT_SECRET=test-secret-key-for-testing-only-do-not-use-in-production
      - USER_TOKEN_COOKIE_NAME=trip2g_e2e # avoid conflicts with dev cookies

      # Git API (DB-canonical mirror: gitapi owns a writable bare repo it
      # materializes from the DB; the testdata vault is mounted read-only).
      - GIT_API_REPO_PATH=/data/git
      - GIT_API_BASE_PATH=/git

      # Email (mock for tests): no SMTP/RESEND configured, so SendMail logs and
      # skips — the send_sign_in_code job succeeds instead of exhausting retries.
      - MAIL_FROM=test@example.com

      # OpenAI key (optional — pass through if you need to switch back to text-embedding-3-small)
      - OPENAI_API_KEY

      # MCP federation
      - MCP_FEDERATION_MAX_DEPTH=3
      - MCP_FEDERATED_GRAPHQL=true
    volumes:
      - ./tmp/data:/data
      - ./testdata/vault:/app/testdata/vault:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:20082/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Read-only replica of the leader (`app`). Same DB file (same ./tmp/data
  # volume → /data/test.sqlite3), so the shared SQLite file IS the replication —
  # no LiteFS needed for local e2e. TRIP2G_LEADER_ADDR makes it serve GET locally
  # and forward every mutating request to the leader's internal intake (app:20082)
  # with an X-Replica-Auth HMAC. Must share JWT_SECRET (X-Replica-Auth + sessions)
  # and the cookie name so sessions created on the leader resolve on the replica.
  # See docs/dev/readreplica.md + e2e/read-replica.spec.js.
  app-replica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip2g-test-app-replica
    depends_on:
      minio:
        condition: service_healthy
      app:
        condition: service_healthy # leader migrates the shared DB first
    ports:
      - "20071:20071"
      - "20072:20072"
    environment:
      - LISTEN_ADDR=0.0.0.0:20071
      - INTERNAL_LISTEN_ADDR=:20072
      - DB_FILE=/data/test.sqlite3 # SAME file as the leader
      - LEADER_ADDR=app:20082      # >>> read-only replica mode ON <<<
      - DEV=true
      - MAX_ACTIVE_SIGNIN_CODES=999
      - LOG_LEVEL=info
      - OWNER_EMAIL=hello@example.com
      - SHUTDOWN_GRACE_PERIOD=1ms
      - SHUTDOWN_TIMEOUT=1ms

      # MinIO — same bucket/no prefix as the leader so the replica reads the
      # leader's assets.
      - MINIO_ENDPOINT=minio:29000
      - MINIO_ACCESS_KEY_ID=testuser
      - MINIO_SECRET_KEY=testpassword
      - MINIO_BUCKET=test-bucket
      - MINIO_USE_SSL=false

      - PUBLIC_URL=http://localhost:20071

      # MUST match the leader exactly (shared DB + X-Replica-Auth signing).
      - JWT_SECRET=test-secret-key-for-testing-only-do-not-use-in-production
      - USER_TOKEN_COOKIE_NAME=trip2g_e2e

      # gitapi materializes its own mirror from the (read-only) shared DB.
      - GIT_API_REPO_PATH=/data/git-replica
      - GIT_API_BASE_PATH=/git
      - MAIL_FROM=test@example.com
    volumes:
      - ./tmp/data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:20072/livez"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Second read-only replica of the leader (`app`). Mirrors app-replica shape
  # exactly — same shared DB file, same LEADER_ADDR — but distinct host ports
  # (20073/20074), distinct cookie name, and distinct GIT_API_REPO_PATH so the
  # two replicas don't collide on their git mirror directories.
  app-replica2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip2g-test-app-replica2
    depends_on:
      minio:
        condition: service_healthy
      app:
        condition: service_healthy # leader migrates the shared DB first
    ports:
      - "20073:20073"
      - "20074:20074"
    environment:
      - LISTEN_ADDR=0.0.0.0:20073
      - INTERNAL_LISTEN_ADDR=:20074
      - DB_FILE=/data/test.sqlite3 # SAME file as the leader
      - LEADER_ADDR=app:20082      # >>> read-only replica mode ON <<<
      - DEV=true
      - MAX_ACTIVE_SIGNIN_CODES=999
      - LOG_LEVEL=info
      - OWNER_EMAIL=hello@example.com
      - SHUTDOWN_GRACE_PERIOD=1ms
      - SHUTDOWN_TIMEOUT=1ms

      # MinIO — same bucket/no prefix as the leader so the replica reads the
      # leader's assets.
      - MINIO_ENDPOINT=minio:29000
      - MINIO_ACCESS_KEY_ID=testuser
      - MINIO_SECRET_KEY=testpassword
      - MINIO_BUCKET=test-bucket
      - MINIO_USE_SSL=false

      - PUBLIC_URL=http://localhost:20073

      # MUST match the leader exactly (shared DB + X-Replica-Auth signing).
      - JWT_SECRET=test-secret-key-for-testing-only-do-not-use-in-production
      - USER_TOKEN_COOKIE_NAME=trip2g_e2e_replica2

      # gitapi materializes its own mirror from the (read-only) shared DB.
      - GIT_API_REPO_PATH=/data/git-replica2
      - GIT_API_BASE_PATH=/git
      - MAIL_FROM=test@example.com
    volumes:
      - ./tmp/data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:20074/livez"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Peer instance for MCP federation e2e tests.
  # Separate DB, cookie name, and minio prefix to keep sessions isolated.
  app-peer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip2g-test-app-peer
    depends_on:
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
    ports:
      - "20091:20091"
      - "20092:20092"
    environment:
      # Server
      - LISTEN_ADDR=0.0.0.0:20091
      - INTERNAL_LISTEN_ADDR=:20092
      - DB_FILE=/data/peer.sqlite3
      - DEV=true
      - MAX_ACTIVE_SIGNIN_CODES=999
      - LOG_LEVEL=info
      - OWNER_EMAIL=hello@example.com
      - SHUTDOWN_GRACE_PERIOD=1ms
      - SHUTDOWN_TIMEOUT=1ms
      - 'FEATURES={"vector_search": {"enabled": true, "model": "bge-m3", "base_url": "http://embedding:8000/v1"}}'

      # MinIO (shared instance, separate prefix)
      - MINIO_ENDPOINT=minio:29000
      - MINIO_ACCESS_KEY_ID=testuser
      - MINIO_SECRET_KEY=testpassword
      - MINIO_BUCKET=test-bucket
      - MINIO_PREFIX=peer/
      - MINIO_USE_SSL=false

      # Public URL (docker-internal so hub can reach peer)
      - PUBLIC_URL=http://app-peer:20091

      # JWT
      - JWT_SECRET=test-peer-secret-key-do-not-use
      - USER_TOKEN_COOKIE_NAME=trip2g_e2e_peer

      # Git API (DB-canonical mirror; writable bare repo, distinct per service)
      - GIT_API_REPO_PATH=/data/git-peer
      - GIT_API_BASE_PATH=/git

      # Email (mock): no SMTP/RESEND configured, so SendMail logs and skips.
      - MAIL_FROM=test@example.com

      # MCP federation
      - MCP_FEDERATION_MAX_DEPTH=3
      - MCP_FEDERATED_GRAPHQL=true
    volumes:
      - ./tmp/data:/data
      - ./testdata/seedvault:/app/testdata/seedvault:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:20092/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Peer instance 2 for MCP federation e2e tests.
  app-peer2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip2g-test-app-peer2
    depends_on:
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
    ports:
      - "20093:20093"
      - "20094:20094"
    environment:
      # Server
      - LISTEN_ADDR=0.0.0.0:20093
      - INTERNAL_LISTEN_ADDR=:20094
      - DB_FILE=/data/peer2.sqlite3
      - DEV=true
      - MAX_ACTIVE_SIGNIN_CODES=999
      - LOG_LEVEL=info
      - OWNER_EMAIL=hello@example.com
      - SHUTDOWN_GRACE_PERIOD=1ms
      - SHUTDOWN_TIMEOUT=1ms
      - 'FEATURES={"vector_search": {"enabled": true, "model": "bge-m3", "base_url": "http://embedding:8000/v1"}}'

      # MinIO (shared instance, separate prefix)
      - MINIO_ENDPOINT=minio:29000
      - MINIO_ACCESS_KEY_ID=testuser
      - MINIO_SECRET_KEY=testpassword
      - MINIO_BUCKET=test-bucket
      - MINIO_PREFIX=peer2/
      - MINIO_USE_SSL=false

      # Public URL (docker-internal so hub can reach peer)
      - PUBLIC_URL=http://app-peer2:20093

      # JWT
      - JWT_SECRET=test-peer2-secret-key-do-not-use
      - USER_TOKEN_COOKIE_NAME=trip2g_e2e_peer2

      # Git API (DB-canonical mirror; writable bare repo, distinct per service)
      - GIT_API_REPO_PATH=/data/git-peer2
      - GIT_API_BASE_PATH=/git

      # Email (mock): no SMTP/RESEND configured, so SendMail logs and skips.
      - MAIL_FROM=test@example.com

      # MCP federation
      - MCP_FEDERATION_MAX_DEPTH=3
      - MCP_FEDERATED_GRAPHQL=true
    volumes:
      - ./tmp/data:/data
      - ./testdata/seedvault2:/app/testdata/seedvault2:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:20094/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Peer instance 3 for MCP federation e2e tests.
  app-peer3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip2g-test-app-peer3
    depends_on:
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
    ports:
      - "20095:20095"
      - "20096:20096"
    environment:
      # Server
      - LISTEN_ADDR=0.0.0.0:20095
      - INTERNAL_LISTEN_ADDR=:20096
      - DB_FILE=/data/peer3.sqlite3
      - DEV=true
      - MAX_ACTIVE_SIGNIN_CODES=999
      - LOG_LEVEL=info
      - OWNER_EMAIL=hello@example.com
      - SHUTDOWN_GRACE_PERIOD=1ms
      - SHUTDOWN_TIMEOUT=1ms
      - 'FEATURES={"vector_search": {"enabled": true, "model": "bge-m3", "base_url": "http://embedding:8000/v1"}}'

      # MinIO (shared instance, separate prefix)
      - MINIO_ENDPOINT=minio:29000
      - MINIO_ACCESS_KEY_ID=testuser
      - MINIO_SECRET_KEY=testpassword
      - MINIO_BUCKET=test-bucket
      - MINIO_PREFIX=peer3/
      - MINIO_USE_SSL=false

      # Public URL (docker-internal so hub can reach peer)
      - PUBLIC_URL=http://app-peer3:20095

      # JWT
      - JWT_SECRET=test-peer3-secret-key-do-not-use
      - USER_TOKEN_COOKIE_NAME=trip2g_e2e_peer3

      # Git API (DB-canonical mirror; writable bare repo, distinct per service)
      - GIT_API_REPO_PATH=/data/git-peer3
      - GIT_API_BASE_PATH=/git

      # Email (mock): no SMTP/RESEND configured, so SendMail logs and skips.
      - MAIL_FROM=test@example.com

      # MCP federation
      - MCP_FEDERATION_MAX_DEPTH=3
      - MCP_FEDERATED_GRAPHQL=true
    volumes:
      - ./tmp/data:/data
      - ./testdata/seedvault3:/app/testdata/seedvault3:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:20096/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Deterministic OpenAI-compatible LLM stub for fleet e2e tests.
  # Responds to POST /v1/chat/completions: call 1 → write_note to segments/,
  # call 2+ → finish. No external deps. See cmd/llmmock/main.go.
  llm-mock:
    build:
      context: .
      dockerfile: Dockerfile.llmmock
    container_name: trip2g-test-llmmock
    ports:
      - "29091:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9091/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Fleet agent host for the fleet e2e spec. Discovers roles/transcript-agent.md,
  # reconciles a change webhook, delivers to the llm-mock, writes segments/ back.
  # JWT_SECRET must match the app's JWT_SECRET so HAT auth works.
  # CALLBACK_URL uses the compose service name so the app container can reach
  # the fleet container over the shared docker network.
  fleet:
    build:
      context: .
      dockerfile: Dockerfile.fleet
    container_name: trip2g-test-fleet
    depends_on:
      app:
        condition: service_healthy
      llm-mock:
        condition: service_healthy
    ports:
      - "29090:9090"
    environment:
      - TRIP2G_FLEET_ID=e2e
      - TRIP2G_LISTEN=:9090
      - TRIP2G_CALLBACK_URL=http://fleet:9090
      - TRIP2G_TRIP2G_URL=http://app:20081
      - TRIP2G_JWT_SECRET=test-secret-key-for-testing-only-do-not-use-in-production
      - TRIP2G_ADMIN_EMAIL=fleet@local
      - TRIP2G_FLEET_SECRET=e2e-fleet-secret
      - TRIP2G_LLM_BASE_URL=http://llm-mock:9091/v1
      - TRIP2G_LLM_API_KEY=x
      - TRIP2G_DEFAULT_MODEL=mock
      - TRIP2G_AGENTS_FOLDER=roles/
      - TRIP2G_POLL_SECONDS=3
      - TRIP2G_TOKEN_CEILING=100000
      - TRIP2G_STEP_CEILING=25
      - TRIP2G_OFFERED_TOOLS=search,read_note,patch_note,write_note
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  test-data:
